<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — ArogyaX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="/static/css/shared.css" />
  <style>
    .profile-header {
      background: linear-gradient(135deg, var(--lime) 0%, #e8f5a8 100%);
      border-radius: var(--radius);
      padding: 32px;
      display: flex; align-items: center; gap: 24px;
      margin-bottom: 24px;
    }
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--dark);
      color: var(--lime);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800;
      border: 4px solid #fff;
    }
    .profile-info h2 { font-size: 24px; font-weight: 800; }
    .profile-info p { font-size: 14px; color: var(--gray-500); margin-top: 4px; }
    .profile-stats {
      display: flex; gap: 24px; margin-top: 12px;
    }
    .profile-stat {
      text-align: center;
    }
    .profile-stat-value {
      font-size: 20px; font-weight: 800; color: var(--dark);
    }
    .profile-stat-label {
      font-size: 11px; color: var(--gray-500); text-transform: uppercase;
    }
    .edit-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .edit-section h3 {
      font-size: 16px; font-weight: 800; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .edit-section h3 svg { width: 20px; height: 20px; color: var(--lime); }
    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block; font-size: 12px; font-weight: 600; color: var(--gray-500);
      margin-bottom: 6px; text-transform: uppercase;
    }
    .form-field input, .form-field select {
      width: 100%; padding: 12px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit;
      transition: var(--transition);
      outline: none;
    }
    .form-field input:focus, .form-field select:focus {
      border-color: var(--lime);
    }
    .save-btn {
      background: var(--dark); color: #fff;
      padding: 14px 32px; border-radius: var(--radius-pill);
      font-size: 14px; font-weight: 700;
      border: none; cursor: pointer;
      transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .logout-btn {
      background: transparent; color: var(--orange);
      padding: 14px 32px; border-radius: var(--radius-pill);
      font-size: 14px; font-weight: 700;
      border: 2px solid var(--orange); cursor: pointer;
      transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .logout-btn:hover { background: var(--orange-light); }
    .action-btns { display: flex; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/" class="brand">
        <div class="brand-logo" aria-label="ArogyaX logo"><i data-lucide="activity"></i></div>
        <div class="brand-text"><h1>ArogyaX</h1><span>Profile</span></div>
      </a>
    </div>
    <div class="nav-right">
      <a href="/" class="icon-btn" title="Dashboard"><i data-lucide="home" style="width:16px;height:16px"></i></a>
      <a href="/auth/logout" class="icon-btn" title="Logout"><i data-lucide="log-out" style="width:16px;height:16px"></i></a>
    </div>
  </nav>

  <main class="main-content">
    <a href="/" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-500);margin-bottom:16px;text-decoration:none">
      <i data-lucide="arrow-left" style="width:16px;height:16px"></i> Back to Dashboard
    </a>

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-avatar" id="avatarLetter">R</div>
      <div class="profile-info">
        <h2 id="displayName">Loading...</h2>
        <p id="displayEmail">Loading...</p>
        <div class="profile-stats">
          <div class="profile-stat">
            <div class="profile-stat-value" id="displayAge">-</div>
            <div class="profile-stat-label">Age</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat-value" id="displayGender">-</div>
            <div class="profile-stat-label">Gender</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat-value">Member</div>
            <div class="profile-stat-label">Since</div>
          </div>
        </div>
      </div>
    </div>

    <form id="profileForm" method="POST" action="/auth/profile">
      <!-- Personal Info -->
      <div class="edit-section">
        <h3><i data-lucide="user"></i> Personal Information</h3>
        <div class="form-row">
          <div class="form-field">
            <label>First Name</label>
            <input type="text" name="first_name" id="firstName" required />
          </div>
          <div class="form-field">
            <label>Last Name</label>
            <input type="text" name="last_name" id="lastName" required />
          </div>
        </div>
        <div class="form-field">
          <label>Email (cannot change)</label>
          <input type="email" id="email" readonly style="background:var(--gray-100)" />
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Age</label>
            <input type="number" name="age" id="age" min="1" max="120" />
          </div>
          <div class="form-field">
            <label>Gender</label>
            <select name="gender" id="gender">
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Health Info -->
      <div class="edit-section">
        <h3><i data-lucide="heart"></i> Health Information</h3>
        <div class="form-row">
          <div class="form-field">
            <label>Weight (kg)</label>
            <input type="number" name="weight" id="weight" step="0.1" min="20" max="300" />
          </div>
          <div class="form-field">
            <label>Height (cm)</label>
            <input type="number" name="height" id="height" min="100" max="250" />
          </div>
        </div>
        <div class="form-field">
          <label>Blood Group</label>
          <select name="blood_group" id="bloodGroup">
            <option value="">Select</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div>
        <div class="form-field">
          <label>Allergies</label>
          <input type="text" name="allergies" id="allergies" placeholder="e.g., Penicillin, Peanuts" />
        </div>
      </div>

      <!-- Emergency Contact -->
      <div class="edit-section">
        <h3><i data-lucide="phone"></i> Emergency Contact</h3>
        <div class="form-row">
          <div class="form-field">
            <label>Contact Name</label>
            <input type="text" name="emergency_name" id="emergencyName" placeholder="Full name" />
          </div>
          <div class="form-field">
            <label>Phone Number</label>
            <input type="tel" name="emergency_phone" id="emergencyPhone" placeholder="+91 XXXXX XXXXX" />
          </div>
        </div>
      </div>

      <div class="action-btns">
        <button type="submit" class="save-btn">
          <i data-lucide="save"></i> Save Changes
        </button>
        <a href="/auth/logout" class="logout-btn">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </form>
  </main>

  <script>
    // Load user profile
    fetch('/api/me')
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          window.location.href = '/auth/login';
          return;
        }
        const u = data.user;
        document.getElementById('firstName').value = u.first_name || '';
        document.getElementById('lastName').value = u.last_name || '';
        document.getElementById('email').value = u.email || '';
        document.getElementById('age').value = u.age || '';
        document.getElementById('gender').value = u.gender || '';
        document.getElementById('weight').value = u.weight || '';
        document.getElementById('height').value = u.height || '';
        document.getElementById('bloodGroup').value = u.blood_group || '';
        document.getElementById('allergies').value = u.allergies || '';
        document.getElementById('emergencyName').value = u.emergency_name || '';
        document.getElementById('emergencyPhone').value = u.emergency_phone || '';

        const fullName = (u.first_name || '') + ' ' + (u.last_name || '').trim();
        document.getElementById('displayName').textContent = fullName || 'User';
        document.getElementById('displayEmail').textContent = u.email || '';
        document.getElementById('displayAge').textContent = u.age || '-';
        document.getElementById('displayGender').textContent = (u.gender || '-').toUpperCase();
        document.getElementById('avatarLetter').textContent = (u.first_name || 'U').charAt(0).toUpperCase();
      })
      .catch(() => { window.location.href = '/auth/login'; });

    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.save-btn');
      const original = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader" style="animation:spin 1s linear infinite"></i> Saving...';
      btn.disabled = true;

      const formData = new FormData(e.target);
      fetch('/auth/profile', {
        method: 'POST',
        body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          btn.innerHTML = '<i data-lucide="check"></i> Saved!';
          btn.style.background = '#16A34A';
          setTimeout(() => {
            btn.innerHTML = original;
            btn.style.background = '';
            btn.disabled = false;
          }, 2000);
        }
      })
      .catch(() => {
        btn.innerHTML = original;
        btn.disabled = false;
      });
    });

    lucide.createIcons();
  </script>
</body>
</html>
